<!DOCTYPE html>
<html>
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>WhisperApp</title>
<style>
body{font-family:sans-serif;background:#111;color:#fff;padding:16px;max-width:500px;margin:auto;padding-bottom:80px}
input,textarea,select{width:100%;padding:12px;margin:8px 0;border-radius:10px;border:none;box-sizing:border-box}
button{padding:12px 18px;border:none;border-radius:10px;background:#ff5a8a;color:#fff;font-weight:bold}
.card{background:#222;padding:12px;border-radius:12px;margin:10px 0}
.card img{width:100%;border-radius:10px}
h2{margin-top:24px}
nav{position:fixed;bottom:0;left:0;right:0;background:#1a1a1a;display:flex;justify-content:space-around;padding:10px;border-top:1px solid #333}
nav button{background:none;color:#aaa;font-size:11px;flex:1;padding:6px 2px}
.circles{display:flex;gap:10px;overflow-x:auto;padding:10px 0}
.circle{flex:0 0 62px;width:62px;height:62px;border-radius:50%;border:3px solid #ff5a8a;display:flex;align-items:center;justify-content:center;font-size:22px;background:#222;cursor:pointer}
.circle span{font-size:10px;display:block;text-align:center}
nav button.active{color:#ff5a8a}
section{display:none}
section.active{display:block}
#map{height:280px;border-radius:12px;margin:10px 0}
.counter{background:#ff5a8a;padding:10px;border-radius:10px;text-align:center;font-weight:bold}
</style><link rel='stylesheet' href='https://unpkg.com/leaflet@1.9.4/dist/leaflet.css'>
</head>
<body>
<h1>WhisperApp</h1>

<section id="tab-profile"><div id="login-box" style="background:#222;padding:15px;border-radius:12px;margin:10px 0">
<h3>Login / Sign Up</h3>
<input id="auth-email" type="email" placeholder="Email">
<input id="auth-pass" type="password" placeholder="Password">
<button onclick="loginUser()" style="width:100%;margin:5px 0">Login</button>
<button onclick="signupUser()" style="width:100%;background:#333;margin:5px 0">Sign Up</button>
<p id="auth-status" style="color:#0f0"></p>
</div>
<div id="my-profile-box" style="background:#222;padding:15px;border-radius:12px;margin:10px 0"><h3>Create My Profile</h3><input id="pf-name" placeholder="Your name" style="width:100%;padding:10px;margin:5px 0;border-radius:8px;border:none"><select id="pf-country" style="width:100%;padding:10px;margin:5px 0;border-radius:8px"><option>Equatorial Guinea</option><option>Nigeria</option><option>Cameroon</option><option>Ghana</option><option>Kenya</option><option>Spain</option><option>France</option><option>USA</option><option>UK</option><option>Brazil</option><option>Morocco</option><option>Senegal</option><option>South Africa</option><option>Germany</option><option>Italy</option><option>Mexico</option><option>Canada</option><option>Egypt</option><option>India</option><option>Colombia</option></select><input type="file" id="pf-photo" accept="image/*" style="margin:5px 0;color:white"><br><img id="pf-preview" style="width:80px;height:80px;border-radius:50%;object-fit:cover;display:none"><br><button id="pf-save-btn" type="button" style="background:#ff5a8a;color:white;border:none;padding:12px;width:100%;border-radius:10px;font-weight:bold;margin-top:8px">Save & Show Me On Map</button><p id="pf-status" style="color:#0f0"></p></div>
<h2>My Profile</h2>
<input id="p-name" placeholder="Your name">
<input id="p-age" type="number" placeholder="Age">
<input id="p-location" placeholder="Country first - e.g. Equatorial Guinea - Malabo">
<select id="p-gender"><option value="">Gender</option><option>Female</option><option>Male</option><option>Other</option></select>
<select id="p-looking"><option value="">Looking for</option><option>Female</option><option>Male</option><option>Anyone</option></select>
<textarea id="p-bio" placeholder="Bio - about you..."></textarea>
<input id="p-interests" placeholder="Interests - e.g. Music, Football, Movies">
<input id="p-language" placeholder="Language - e.g. Spanish, English, French">
<input id="p-img" placeholder="Photo link - paste image URL">
<button onclick="saveProfile()">Save Profile</button>
<h2>⚙️ Settings</h2>
<div class="card"><label>Notifications</label><select id="s-notif"><option>On</option><option>Off</option></select><label>Show my profile</label><select id="s-visible"><option>Everyone</option><option>Only Matches</option><option>Hidden</option></select><label>Language</label><select id="s-lang"><option>English</option><option>Spanish</option><option>French</option></select><button onclick="alert('Settings saved')">Save Settings</button></div>
</section>

<section id="tab-people">
<h2>People by Country</h2>
<div id="profiles"></div>
</section>

<section id="tab-whisper">
<h2>Whisper</h2>
<input id="name" placeholder="Your name">
<textarea id="text" placeholder="Write a whisper..."></textarea>
<button onclick="sendWhisper()">Send Whisper</button>
<div id="list"></div>
</section>


<section id="tab-discover" class="active">
<h2>🔥 Discover</h2>
<div class="counter" id="daily-counter">❤️ 30 Likes left today</div>
<div id="map"></div>
<p style="font-size:13px;color:#aaa">Tap a circle to Like. Each Like uses 1 of your 30 daily. Resets tomorrow.</p>
<div class="circles" id="circles"></div>
<</p>
<div id="discover-list"></div>
</section>
<section id="tab-matches">
<h2>❤️ Matches</h2>
<div id="matches-list"><p>No matches yet. Like people in Discover.</p></div>
</section>
<section id="tab-messages">
<h2>💬 Messages</h2>
<div id="messages-list"><p>No messages yet.</p></div>
<input id="msg-input" placeholder="Type a message...">
<button onclick="sendMsg()">Send</button>
</section>
<nav>
<button id="btn-discover" class="active" onclick="showTab('discover')">🔥 Discover</button>
<button id="btn-people" onclick="showTab('people')">🌍 People</button>
<button id="btn-matches" onclick="showTab('matches')">❤️ Matches</button>
<button id="btn-messages" onclick="showTab('messages')">💬 Messages</button>
<button id="btn-whisper" onclick="showTab('whisper')">🗣️ Whisper</button>
<button id="btn-profile" onclick="showTab('profile')">👤 Profile</button>
</nav>

<script>
// MAP + 30 DAILY LIMIT
const names=["Amina","Carlos","Maria","John","Fatima","David","Sofia","James","Luna","Peter","Nina","Alex","Marta","Kevin","Ada","Luis","Zoe","Emma","Noah","Mia","Liam","Ava","Ethan","Chloe","Lucas","Elena","Omar","Sara","Diego","Grace"];
const countries=["Equatorial Guinea","Nigeria","Cameroon","Spain","Ghana","France","USA","Kenya","Brazil","Germany","Morocco","Italy","Senegal","UK","Mexico","Portugal","Egypt","Canada","Colombia","Turkey","South Africa","India","Poland","Netherlands","Chile","Argentina","Japan","Australia","Peru","Belgium"];
function todayKey(){ return 'likes_'+new Date().toISOString().slice(0,10); }
function getLiked(){ try{ return JSON.parse(localStorage.getItem(todayKey())||'[]'); }catch(e){ return []; } }
function renderCircles(){
  let liked=getLiked();
  let left=30-liked.length;
  let ctr=document.getElementById('daily-counter');
  if(ctr) ctr.textContent = left<=0 ? '😴 No Likes left today - come back tomorrow!' : '❤️ '+left+' Likes left today';
  let c=document.getElementById('circles');
  if(!c) return;
  c.innerHTML=names.map((n,i)=>{
    let isLiked=liked.includes(n);
    let style=isLiked ? 'border-color:#555;opacity:0.4' : '';
    return `<div class="circle" style="${style}" onclick="likePerson('${n}')"><div>${isLiked?'❤️':'👤'}<br><span>${n}</span><br><span style="font-size:8px">${countries[i]}</span></div></div>`;
  }).join('');
}
function likePerson(name){
  let liked=getLiked();
  if(liked.includes(name)){ alert(name+' already liked today'); return; }
  if(liked.length>=30){ alert('Daily limit reached! 30/30'); return; }
  liked.push(name); localStorage.setItem(todayKey(), JSON.stringify(liked));
  renderCircles(); initMap();
  alert('❤️ You liked '+name+'! '+(30-liked.length)+' left today');
}
function initMap(){
  let m=document.getElementById('map'); if(!m||!window.L) return;
  if(window._map){ window._map.remove(); }
  let map=L.map('map').setView([3.75, 8.78], 2); window._map=map;
  L.tileLayer('https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png',{maxZoom:19}).addTo(map);
  let liked=getLiked();
  names.forEach((n,i)=>{
    let lat=3.75 + (Math.sin(i*2.3)*25);
    let lng=8.78 + (Math.cos(i*1.7)*45);
    let color=liked.includes(n)?'red':'pink';
    L.circleMarker([lat,lng],{radius:8,color:color,fillColor:color,fillOpacity:0.9}).addTo(map).bindPopup('<b>'+n+'</b><br>'+countries[i]+'<br><button onclick="likePerson(\''+n+'\')">❤️ Like</button>');
  });
}
renderCircles();
setTimeout(()=>{initMap(); if(window._map) window._map.invalidateSize();}, 800);

function sendMsg(){ let v=document.getElementById('msg-input').value; if(!v) return; document.getElementById('messages-list').innerHTML+='<div class="card">You: '+v+'</div>'; document.getElementById('msg-input').value=''; }
function showTab(name){
 document.querySelectorAll('section').forEach(s=>s.classList.remove('active'));
 document.querySelectorAll('nav button').forEach(b=>b.classList.remove('active'));
 document.getElementById('tab-'+name).classList.add('active');
 document.getElementById('btn-'+name).classList.add('active'); if(name=='discover'){ setTimeout(initMap,300); }
}

async function signupUser(){
  let email=document.getElementById('auth-email').value;
  let pass=document.getElementById('auth-pass').value;
  let {data,error}=await supabase.auth.signUp({email:email,password:pass});
  document.getElementById('auth-status').textContent=error?error.message:'Check your email to confirm, then Login!';
}
async function loginUser(){
  let email=document.getElementById('auth-email').value;
  let pass=document.getElementById('auth-pass').value;
  let {data,error}=await supabase.auth.signInWithPassword({email:email,password:pass});
  document.getElementById('auth-status').textContent=error?error.message:'Logged in as '+email;
  if(!error) document.getElementById('login-box').style.display='none';
}
</script>
<script src="supabase.js"></script>
<script src="app.js"></script>
<script src='https://unpkg.com/leaflet@1.9.4/dist/leaflet.js'></script>


<script>
window._myPhoto='';
document.addEventListener('change', function(e){ if(e.target && e.target.id=='pf-photo'){ var f=e.target.files[0]; if(!f) return; var r=new FileReader(); r.onload=function(ev){ window._myPhoto=ev.target.result; var im=document.getElementById('pf-preview'); if(im){im.src=window._myPhoto; im.style.display='block';} }; r.readAsDataURL(f); }});
function saveMyProfile(){
  var n=document.getElementById('pf-name'); var c=document.getElementById('pf-country');
  if(!n || !n.value.trim()){ alert('Please enter your name'); return; }
  var prof={name:n.value.trim(), country:c?c.value:'Equatorial Guinea', photo:window._myPhoto||'', time:Date.now()};
  try{ localStorage.setItem('my_profile', JSON.stringify(prof)); var all=[]; try{all=JSON.parse(localStorage.getItem('all_profiles')||'[]');}catch(e){} all=all.filter(function(x){return x.name!==prof.name}); all.unshift(prof); localStorage.setItem('all_profiles', JSON.stringify(all)); }catch(e){ alert('Storage error: '+e); return; }
  var st=document.getElementById('pf-status'); if(st) st.textContent='Saved! Go to Discover - you are now on the map!';
  alert(prof.name+' from '+prof.country+' is now on the map!');
  if(typeof initMap==='function'){ try{initMap();}catch(e){} }
}
document.addEventListener('click', function(e){ if(e.target && e.target.id=='pf-save-btn'){ saveMyProfile(); }});
window.saveMyProfile=saveMyProfile;
</script>


<style>#my-profile-box{display:none} #profile:not([style*="display: none"]) #my-profile-box{display:block}</style>


<style>#my-profile-box{display:none !important} body[data-current-tab="profile"] #my-profile-box{display:block !important}</style>

</body>
</html>
