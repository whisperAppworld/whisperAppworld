<!DOCTYPE html>
<html>
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>WhisperApp</title>
<style>
body{font-family:sans-serif;background:#111;color:#fff;padding:16px;max-width:500px;margin:auto}
input,textarea,select{width:100%;padding:12px;margin:8px 0;border-radius:10px;border:none;box-sizing:border-box}
button{padding:12px 18px;border:none;border-radius:10px;background:#ff5a8a;color:#fff;font-weight:bold}
.card{background:#222;padding:12px;border-radius:12px;margin:10px 0}
.card img{width:100%;border-radius:10px}
h2{margin-top:24px}
</style>
</head>
<body>
<h1>WhisperApp</h1>

<h2>My Profile</h2>
<input id="p-name" placeholder="Your name">
<input id="p-age" type="number" placeholder="Age">
<input id="p-location" placeholder="Country first - e.g. Equatorial Guinea - Malabo">
<select id="p-gender"><option value="">Gender</option><option>Female</option><option>Male</option><option>Other</option></select>
<select id="p-looking"><option value="">Looking for</option><option>Female</option><option>Male</option><option>Anyone</option></select>
<textarea id="p-bio" placeholder="Bio - about you..."></textarea><input id="p-interests" placeholder="Interests - e.g. Music, Football, Movies"><input id="p-language" placeholder="Language - e.g. Spanish, English, French">
<input id="p-img" placeholder="Photo link - paste image URL">
<button onclick="saveProfile()">Save Profile</button><h2>People by Country</h2><div id="profiles"></div>

<h2>Whisper</h2>
<input id="name" placeholder="Your name">
<textarea id="text" placeholder="Write a whisper..."></textarea>
<button onclick="sendWhisper()">Send Whisper</button>
<div id="list"></div>
<script src="supabase.js"></script>
<script src="app.js"></script>
</body>
</html>
