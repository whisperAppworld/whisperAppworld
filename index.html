<!DOCTYPE html>
<html>
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>WhisperApp</title>
<style>
body{font-family:sans-serif;background:#111;color:#fff;padding:16px;max-width:500px;margin:auto;padding-bottom:80px}
input,textarea,select{width:100%;padding:12px;margin:8px 0;border-radius:10px;border:none;box-sizing:border-box}
button{padding:12px 18px;border:none;border-radius:10px;background:#ff5a8a;color:#fff;font-weight:bold}
.card{background:#222;padding:12px;border-radius:12px;margin:10px 0}
.card img{width:100%;border-radius:10px}
h2{margin-top:24px}
nav{position:fixed;bottom:0;left:0;right:0;background:#1a1a1a;display:flex;justify-content:space-around;padding:10px;border-top:1px solid #333}
nav button{background:none;color:#aaa;font-size:11px;flex:1;padding:6px 2px}
.circles{display:flex;gap:10px;overflow-x:auto;padding:10px 0}
.circle{flex:0 0 62px;width:62px;height:62px;border-radius:50%;border:3px solid #ff5a8a;display:flex;align-items:center;justify-content:center;font-size:22px;background:#222;cursor:pointer}
.circle span{font-size:10px;display:block;text-align:center}
nav button.active{color:#ff5a8a}
section{display:none}
section.active{display:block}
</style>
</head>
<body>
<h1>WhisperApp</h1>

<section id="tab-profile" class="active">
<h2>My Profile</h2>
<input id="p-name" placeholder="Your name">
<input id="p-age" type="number" placeholder="Age">
<input id="p-location" placeholder="Country first - e.g. Equatorial Guinea - Malabo">
<select id="p-gender"><option value="">Gender</option><option>Female</option><option>Male</option><option>Other</option></select>
<select id="p-looking"><option value="">Looking for</option><option>Female</option><option>Male</option><option>Anyone</option></select>
<textarea id="p-bio" placeholder="Bio - about you..."></textarea>
<input id="p-interests" placeholder="Interests - e.g. Music, Football, Movies">
<input id="p-language" placeholder="Language - e.g. Spanish, English, French">
<input id="p-img" placeholder="Photo link - paste image URL">
<button onclick="saveProfile()">Save Profile</button>
<h2>⚙️ Settings</h2>
<div class="card"><label>Notifications</label><select id="s-notif"><option>On</option><option>Off</option></select><label>Show my profile</label><select id="s-visible"><option>Everyone</option><option>Only Matches</option><option>Hidden</option></select><label>Language</label><select id="s-lang"><option>English</option><option>Spanish</option><option>French</option></select><button onclick="alert('Settings saved')">Save Settings</button></div>
</section>

<section id="tab-people">
<h2>People by Country</h2>
<div id="profiles"></div>
</section>

<section id="tab-whisper">
<h2>Whisper</h2>
<input id="name" placeholder="Your name">
<textarea id="text" placeholder="Write a whisper..."></textarea>
<button onclick="sendWhisper()">Send Whisper</button>
<div id="list"></div>
</section>


<section id="tab-discover">
<h2>🔥 Discover</h2>
<div class="circles" id="circles"></div>
<p>30 people circling near you - tap a circle to view</p>
<div id="discover-list"></div>
</section>
<section id="tab-matches">
<h2>❤️ Matches</h2>
<div id="matches-list"><p>No matches yet. Like people in Discover.</p></div>
</section>
<section id="tab-messages">
<h2>💬 Messages</h2>
<div id="messages-list"><p>No messages yet.</p></div>
<input id="msg-input" placeholder="Type a message...">
<button onclick="sendMsg()">Send</button>
</section>
<nav>
<button id="btn-discover" onclick="showTab('discover')">🔥 Discover</button>
<button id="btn-people" onclick="showTab('people')">🌍 People</button>
<button id="btn-matches" onclick="showTab('matches')">❤️ Matches</button>
<button id="btn-messages" onclick="showTab('messages')">💬 Messages</button>
<button id="btn-whisper" onclick="showTab('whisper')">🗣️ Whisper</button>
<button id="btn-profile" class="active" onclick="showTab('profile')">👤 Profile</button>
</nav>

<script>
// 30 circling profiles
const names=["Amina","Carlos","Maria","John","Fatima","David","Sofia","James","Luna","Peter","Nina","Alex","Marta","Kevin","Ada","Luis","Zoe","Emma","Noah","Mia","Liam","Ava","Ethan","Chloe","Lucas","Elena","Omar","Sara","Diego","Grace"];
let c=document.getElementById('circles');
if(c){ c.innerHTML=names.map((n,i)=>`<div class="circle" onclick="alert('Viewing '+n)"><div>👤<br><span>${n}</span></div></div>`).join(''); }
function sendMsg(){ let v=document.getElementById('msg-input').value; if(!v) return; document.getElementById('messages-list').innerHTML+='<div class="card">You: '+v+'</div>'; document.getElementById('msg-input').value=''; }
function showTab(name){
 document.querySelectorAll('section').forEach(s=>s.classList.remove('active'));
 document.querySelectorAll('nav button').forEach(b=>b.classList.remove('active'));
 document.getElementById('tab-'+name).classList.add('active');
 document.getElementById('btn-'+name).classList.add('active');
}
</script>
<script src="supabase.js"></script>
<script src="app.js"></script>
</body>
</html>
