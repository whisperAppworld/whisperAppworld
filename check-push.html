<!DOCTYPE html><html><body style="font-family:sans-serif;padding:20px">
<h2>Push Check</h2><pre id="out">trying setupPush()...</pre>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<script src="supabase.js"></script>
<script src="push.js"></script>
<script>
(async()=>{
  let out=document.getElementById('out');
  let logs=[];
  let oldLog=console.log; console.log=(...a)=>{ logs.push(a.map(x=>{try{return JSON.stringify(x)}catch(e){return String(x)}}).join(' ')); oldLog(...a); };
  try{
    await new Promise(r=>setTimeout(r,1500));
    let ok = await window.setupPush();
    await new Promise(r=>setTimeout(r,500));
    let reg=await navigator.serviceWorker.getRegistration();
    let sub=await reg?.pushManager.getSubscription();
    let uid=await getCurrentUid();
    let db=await window.isPushEnabledInDB();
    out.textContent='setupPush returned: '+ok+'\nsub now: '+!!sub+'\nuid: '+(uid||'NULL')+'\nDB check: '+db+'\n\nLOGS:\n'+logs.join('\n');
  }catch(e){ out.textContent='ERROR: '+e.message+'\n\nLOGS:\n'+logs.join('\n'); }
})();
</script></body></html>
