<!DOCTYPE html><html><body style="font-family:sans-serif;padding:20px">
<h2>Push Check</h2><pre id="out">waiting for login + SW... (2 sec)</pre>
<script src="supabase.js"></script>
<script src="push.js"></script>
<script>
(async()=>{
  let out=document.getElementById('out');
  try{
    await new Promise(r=>setTimeout(r,2000));
    let reg = await navigator.serviceWorker.register('sw.js?v=6');
    await navigator.serviceWorker.ready;
    let perm=Notification.permission;
    let reg2=await navigator.serviceWorker.getRegistration();
    let sub=await reg2?.pushManager.getSubscription();
    let uid=await getCurrentUid();
    let sess=await window.supabase.auth.getSession();
    let db=await window.isPushEnabledInDB();
    out.textContent='perm: '+perm+'\nreg: '+!!reg2+'\nsub: '+!!sub+'\nuid: '+(uid||'NULL')+'\nsession: '+!!sess.data.session+'\nDB check: '+db;
  }catch(e){ out.textContent='ERROR: '+e.message; }
})();
</script></body></html>
