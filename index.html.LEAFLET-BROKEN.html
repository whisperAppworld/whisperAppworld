<!DOCTYPE html>
<html><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no">
<title>Whisper - World Map</title>
<link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css">
<link rel="stylesheet" href="https://unpkg.com/leaflet.markercluster@1.5.3/dist/MarkerCluster.css">
<link rel="stylesheet" href="https://unpkg.com/leaflet.markercluster@1.5.3/dist/MarkerCluster.Default.css">
<style>
*{margin:0;padding:0;box-sizing:border-box} body{font-family:system-ui,sans-serif;overflow:hidden}
#map{height:100vh;width:100vw;z-index:1;background:#aed6f1}
.topbar{position:fixed;top:12px;left:12px;right:12px;z-index:1000;display:flex;justify-content:space-between;align-items:center;pointer-events:auto}
.logo{background:#111;color:#fff;padding:10px 16px;border-radius:999px;font-weight:800;font-size:18px}
.count{background:#fff;padding:8px 14px;border-radius:999px;font-weight:700;font-size:13px}
.hint{position:fixed;bottom:20px;left:50%;transform:translateX(-50%);z-index:1000;background:rgba(0,0,0,.75);color:#fff;padding:9px 16px;border-radius:999px;font-size:13px;white-space:nowrap}
.avatar-marker{width:44px;height:44px;border-radius:50%;border:3px solid #fff;box-shadow:0 3px 12px rgba(0,0,0,.4);object-fit:cover}
.card{position:fixed;left:12px;right:12px;bottom:12px;z-index:2000;background:#fff;border-radius:20px;padding:14px;display:none;box-shadow:0 10px 40px rgba(0,0,0,.3)}
.card.show{display:block}
.card-top{display:flex;gap:12px}
.card-top img{width:72px;height:72px;border-radius:16px;object-fit:cover}
.card h2{font-size:19px} .card .loc{color:#666;font-size:13px;margin:3px 0}
.card .bio{font-size:14px;margin:8px 0;line-height:1.4}
.card .prompt{background:#f5f5f5;border-radius:12px;padding:10px;font-size:13px}
.card .prompt b{color:#e91e63}
.btns{display:flex;gap:10px;margin-top:12px}
.btns button{flex:1;padding:12px;border:0;border-radius:999px;font-weight:700;font-size:15px}
.btn-chat{background:#111;color:#fff} .btn-close{background:#eee}
</style></head>
<body>
<div id="map"></div>
<div class="topbar"><div class="logo" onclick="window.location.href='index.html.BACKUP-search.html';return false;" style="cursor:pointer">← Menu &nbsp; Whisper 🌎</div><div class="count" id="count"></div></div>
<div class="hint" id="hint">🌍 Pinch to zoom - tap a face to meet them</div>
<div class="card" id="card"></div>
<script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
<script src="https://unpkg.com/leaflet.markercluster@1.5.3/dist/leaflet.markercluster.js"></script>
<script src="script.js"></script>
<script>
const map = L.map('map',{zoomControl:false}).setView([20,0],2);
L.control.zoom({position:'bottomright'}).addTo(map);
L.tileLayer('https://tile.openstreetmap.org/{z}/{x}/{y}.png',{maxZoom:18}).addTo(map);
document.getElementById('count').textContent = profiles.length + ' people worldwide';
const cluster = L.markerClusterGroup({showCoverageOnHover:false,maxClusterRadius:50,disableClusteringAtZoom:6});
profiles.forEach(p=>{
  if(!p.lat) return;
  const icon = L.divIcon({className:'',html:'<img class="avatar-marker" src="'+p.img+'">',iconSize:[44,44],iconAnchor:[22,22]});
  const m = L.marker([p.lat,p.lng],{icon});
  m.on('click',()=>{
    document.getElementById('hint').style.display='none';
    document.getElementById('card').innerHTML='<div class="card-top"><img src="'+p.img+'"><div><h2>'+p.name+'</h2><div class="loc">'+p.location+'</div><div style="font-size:13px;color:#e91e63">Online now</div></div></div><div class="bio">'+p.bio+'</div><div class="prompt"><b>'+p.promptQ+'</b><br>'+p.promptA+'</div><div class="btns"><button class="btn-chat">Say Hi</button><button class="btn-close" onclick="document.getElementById(\'card\').classList.remove(\'show\')">Close</button></div>';
    document.getElementById('card').classList.add('show');
  });
  cluster.addLayer(m);
});
map.addLayer(cluster);
</script></body></html>
